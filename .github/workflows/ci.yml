name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# The event action is part of the identity on purpose. With one group per pull
# request, a draft `synchronize` and the `ready_for_review` that follows it
# cancel each other, and the survivor is whichever GitHub started last. That is
# how a non-draft pull request came to report every required check as "skipped"
# while its last real run had tested an earlier commit.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action || github.event_name
    }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: Select verification plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.repository.private == false &&
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      dependency_audit: ${{ steps.plan.outputs.dependency_audit }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci-plan.py \
            --event "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  compatibility:
    name: Ubuntu compatibility
    needs: verification-plan
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.repository.private == false &&
          github.event.pull_request.draft == false
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_LM_DATA_DIR: ${{ github.workspace }}/temp/local-lm-tests
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - name: Require a valid verification plan
        if: needs.verification-plan.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable source history for secrets
        if: needs.verification-plan.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive_name="gitleaks_${version}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          expected_hash=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive_name"
          echo "$expected_hash  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install verification dependencies
        if: needs.verification-plan.outputs.mode == 'full'
        run: |
          uv sync --project services/api --locked --python 3.12 \
            --extra dev \
            --extra package
          npm ci
      - name: Audit locked dependencies
        if: needs.verification-plan.outputs.dependency_audit == 'true'
        run: |
          npm audit --audit-level=high
          mkdir -p temp/pip-audit-cache
          .venv/bin/python -m pip_audit \
            --skip-editable \
            --progress-spinner off \
            --cache-dir temp/pip-audit-cache
      - name: Install ffmpeg for media pipeline tests
        if: needs.verification-plan.outputs.mode == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run repository verification
        if: needs.verification-plan.outputs.mode == 'full'
        run: ./scripts/verify.sh
      - name: Install golden-path browser
        if: needs.verification-plan.outputs.mode == 'full'
        run: npx playwright install --with-deps chromium
      - name: Run browser golden path
        if: needs.verification-plan.outputs.mode == 'full'
        run: npm run e2e:run
      - name: Certify synthetic workflow editor browser protocol
        if: needs.verification-plan.outputs.mode == 'full'
        run: npm run e2e:workflow-editor:run
      - name: Validate documentation-only change
        if: needs.verification-plan.outputs.mode == 'documentation'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check-repository-hygiene.py
          git diff --check $BASE_SHA...$HEAD_SHA --
      - name: Confirm exact develop promotion
        if: needs.verification-plan.outputs.mode == 'promotion'
        run: echo Protected develop is ready for exact-tree promotion to main.

  # The required context that cannot be satisfied by absence.
  #
  # A GitHub ruleset treats a *skipped* required check as satisfied, so every
  # job in this file guarding itself with `if: draft == false` leaves a draft
  # pull request looking exactly like a fully verified one. This job runs with
  # `if: always()`, so it always produces a real conclusion, and it fails unless
  # the jobs the plan actually required for this head succeeded.
  #
  # It must be listed as a required check in the branch ruleset. Nothing here
  # changes the ruleset - that is a separate, deliberate step.
  merge-gate:
    name: Merge gate
    if: always() && github.event_name == 'pull_request'
    needs: [verification-plan, compatibility, windows-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require real verification for this exact head
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN: ${{ needs.verification-plan.result }}
          UBUNTU: ${{ needs.compatibility.result }}
          WINDOWS: ${{ needs.windows-compatibility.result }}
          WINDOWS_REQUIRED: ${{ needs.verification-plan.outputs.windows }}
        run: |
          set -euo pipefail
          echo "action=$ACTION draft=$DRAFT head=$HEAD_SHA"
          echo "plan=$PLAN ubuntu=$UBUNTU windows=$WINDOWS windows_required=$WINDOWS_REQUIRED"

          # A draft is not a verified state, so it must not leave a *successful*
          # required context attached to its head. Exiting zero here would mean
          # that if the later ready_for_review run is ever lost - which is the
          # exact failure this job exists for - the same commit still carries a
          # green merge gate and can be merged untested.
          if [ "$DRAFT" = "true" ]; then
            echo "Draft pull request: full verification is deferred until ready_for_review."
            echo "Failing closed so this head is never authorized while it is a draft."
            exit 1
          fi

          if [ "$PLAN" != "success" ]; then
            echo "The verification plan did not succeed for $HEAD_SHA (result: $PLAN)."
            exit 1
          fi
          if [ "$UBUNTU" != "success" ]; then
            echo "Ubuntu compatibility did not succeed for $HEAD_SHA (result: $UBUNTU)."
            echo "A skipped or cancelled job is not a passing one."
            exit 1
          fi

          # Windows is conditional: the plan decides whether this change needs
          # it. Demanding it unconditionally would fail every documentation
          # change, and ignoring it would let the gate go green while a
          # plan-required Windows leg was still running or had already failed.
          if [ "$WINDOWS_REQUIRED" = "true" ]; then
            if [ "$WINDOWS" != "success" ]; then
              echo "The plan required Windows compatibility and it did not succeed (result: $WINDOWS)."
              exit 1
            fi
          else
            echo "The plan did not require Windows compatibility for this change."
          fi

          echo "Merge gate green for $HEAD_SHA."

  windows-compatibility:
    name: Windows compatibility
    needs: verification-plan
    if: needs.verification-plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      LOCAL_LM_DATA_DIR: ${{ github.workspace }}/temp/local-lm-tests
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install verification dependencies
        run: |
          uv sync --project services/api --locked --python 3.12 --extra dev --extra package
          npm.cmd ci
      - name: Install ffmpeg for media pipeline tests
        shell: pwsh
        run: |
          # The community feed returns 503 and 504 often enough to fail runs
          # on its own. The pinned version is what matters; how many attempts
          # it took to fetch it does not.
          $attempt = 0
          while ($true) {
            $attempt++
            choco install ffmpeg --version 8.1.2 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 4) { throw "choco install ffmpeg failed after $attempt attempts." }
            Write-Host "Attempt $attempt failed; retrying in $(15 * $attempt)s."
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Run repository verification
        run: .\scripts\verify.ps1

  scheduled-audit:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.18'
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install audit dependencies
        run: |
          uv sync --project services/api --locked --python 3.12 \
            --extra dev \
            --extra package
          npm ci
      - name: Audit locked dependencies
        run: |
          npm audit --audit-level=high
          mkdir -p temp/pip-audit-cache
          .venv/bin/python -m pip_audit \
            --skip-editable \
            --progress-spinner off \
            --cache-dir temp/pip-audit-cache
