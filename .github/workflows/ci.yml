name: CI

on:
  pull_request:
    branches: [develop, main]
    # converted_to_draft and edited are here so the same head cannot keep an
    # authorization it earned under different conditions. Converting to draft
    # must re-run and fail closed; editing the base branch changes which policy
    # applies, and a stale success from the old base is not evidence about the
    # new one.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# The event action is part of the identity on purpose. With one group per pull
# request, a draft `synchronize` and the `ready_for_review` that follows it
# cancel each other, and the survivor is whichever GitHub started last. That is
# how a non-draft pull request came to report every required check as "skipped"
# while its last real run had tested an earlier commit.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action || github.event_name
    }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: Select verification plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'merge_group' &&
        github.event.action == 'checks_requested' &&
        github.event.repository.private == false &&
        github.event.merge_group.base_ref == 'refs/heads/develop'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.repository.private == false &&
        github.event.pull_request.draft == false &&
        (
          github.event.action != 'edited' ||
          github.event.changes.base.ref.from != '' ||
          github.event.changes.base.sha.from != ''
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      dependency_audit: ${{ steps.plan.outputs.dependency_audit }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.head_ref }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci-plan.py \
            --event "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  compatibility:
    name: Ubuntu compatibility
    needs: verification-plan
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'merge_group' &&
          github.event.action == 'checks_requested' &&
          github.event.repository.private == false &&
          github.event.merge_group.base_ref == 'refs/heads/develop'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.repository.private == false &&
          github.event.pull_request.draft == false
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOCAL_LM_DATA_DIR: ${{ github.workspace }}/temp/local-lm-tests
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - name: Require a valid verification plan
        if: needs.verification-plan.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable source history for secrets
        if: needs.verification-plan.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive_name="gitleaks_${version}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          expected_hash=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive_name"
          echo "$expected_hash  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # -v prints RuleID, File and Line for each finding. Without it the
          # step fails with only "leaks found: 1" and names nothing, so a
          # refusal on a false positive costs a person a manual bisect. Secret
          # and Match stay redacted, so nothing candidate-secret reaches a
          # public log.
          "$RUNNER_TEMP/gitleaks" git . --redact -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: needs.verification-plan.outputs.mode == 'full'
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install verification dependencies
        if: needs.verification-plan.outputs.mode == 'full'
        run: |
          uv sync --project services/api --locked --python 3.12 \
            --extra dev \
            --extra package
          npm ci
      - name: Audit locked dependencies
        if: needs.verification-plan.outputs.dependency_audit == 'true'
        run: |
          npm audit --audit-level=high
          .venv/bin/python scripts/audit-dependencies.py
      - name: Install ffmpeg for media pipeline tests
        if: needs.verification-plan.outputs.mode == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run repository verification
        if: needs.verification-plan.outputs.mode == 'full'
        run: ./scripts/verify.sh
      - name: Install golden-path browser
        if: needs.verification-plan.outputs.mode == 'full'
        run: npx playwright install --with-deps chromium
      - name: Run browser golden path
        if: needs.verification-plan.outputs.mode == 'full'
        run: npm run e2e:run
      - name: Certify synthetic workflow editor browser protocol
        if: needs.verification-plan.outputs.mode == 'full'
        run: npm run e2e:workflow-editor:run
      - name: Validate documentation-only change
        if: needs.verification-plan.outputs.mode == 'documentation'
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check-repository-hygiene.py
          git diff --check $BASE_SHA...$HEAD_SHA --
      - name: Confirm exact develop promotion
        if: needs.verification-plan.outputs.mode == 'promotion'
        run: echo Protected develop is ready for exact-tree promotion to main.

  # The required context that cannot be satisfied by absence.
  #
  # A GitHub ruleset treats a *skipped* required check as satisfied, so every
  # job in this file guarding itself with `if: draft == false` leaves a draft
  # pull request looking exactly like a fully verified one. This job runs with
  # `if: always()`, so it always produces a real conclusion, and it fails unless
  # the jobs the plan actually required for this head succeeded.
  #
  # It must be listed as a required check in the branch ruleset. Nothing here
  # changes the ruleset - that is a separate, deliberate step.
  merge-gate:
    name: Merge gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [verification-plan, compatibility, windows-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The decision is a tracked script, so it has to be fetched before it can
      # be run, and it must be the copy belonging to the head under judgement -
      # not whatever the default ref resolves to. No credentials are persisted:
      # this job reads a decision, it never writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      # A pinned interpreter rather than whatever `python` happens to mean on
      # the runner, so the gate's verdict does not depend on ambient tooling.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require real verification for this exact head
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.head_ref }}
          RUN_SHA: ${{ github.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          PLAN: ${{ needs.verification-plan.result }}
          UBUNTU: ${{ needs.compatibility.result }}
          WINDOWS: ${{ needs.windows-compatibility.result }}
          WINDOWS_REQUIRED: ${{ needs.verification-plan.outputs.windows }}
          BASE_CHANGED: ${{ github.event.changes.base.ref.from != '' || github.event.changes.base.sha.from != '' }}
        # The decision lives in a script so the workflow validator can run the
        # same bytes rather than a re-description of them. Python, not shell:
        # the validator already needs Python, so the gate can never be
        # unevaluable in a context that is checking it.
        run: python scripts/ci-merge-gate.py

  windows-compatibility:
    name: Windows compatibility
    needs: verification-plan
    if: needs.verification-plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      LOCAL_LM_DATA_DIR: ${{ github.workspace }}/temp/local-lm-tests
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install verification dependencies
        run: |
          uv sync --project services/api --locked --python 3.12 --extra dev --extra package
          npm.cmd ci
      - name: Install ffmpeg for media pipeline tests
        shell: pwsh
        run: |
          # The community feed returns 503 and 504 often enough to fail runs
          # on its own. The pinned version is what matters; how many attempts
          # it took to fetch it does not.
          $attempt = 0
          while ($true) {
            $attempt++
            choco install ffmpeg --version 8.1.2 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 4) { throw "choco install ffmpeg failed after $attempt attempts." }
            Write-Host "Attempt $attempt failed; retrying in $(15 * $attempt)s."
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Run repository verification
        run: .\scripts\verify.ps1

  scheduled-audit:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.18'
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install audit dependencies
        run: |
          uv sync --project services/api --locked --python 3.12 \
            --extra dev \
            --extra package
          npm ci
      - name: Audit locked dependencies
        run: |
          npm audit --audit-level=high
          .venv/bin/python scripts/audit-dependencies.py
